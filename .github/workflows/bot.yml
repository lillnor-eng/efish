name: sync

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run job
        env:
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          DISCLOSURE: ${{ secrets.DISCLOSURE }}
          HIVE_ACCOUNT: ${{ vars.HIVE_ACCOUNT }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          MODEL: ${{ vars.MODEL }}
          POST_COMMUNITY: ${{ vars.POST_COMMUNITY }}
          TAGS: ${{ vars.TAGS }}
          SELF_VOTE: ${{ vars.SELF_VOTE }}
          ARXIV_QUERY: ${{ vars.ARXIV_QUERY }}
          IMAGES: ${{ vars.IMAGES }}
          FORCE: ${{ vars.FORCE }}
        run: python bot.py

      - name: Save encrypted state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add state.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
